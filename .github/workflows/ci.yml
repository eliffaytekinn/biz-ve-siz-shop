name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Sözdizimi kontrolü
        run: node --check server.js

      - name: Testleri çalıştır
        run: npm test

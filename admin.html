<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>biz ve siz | Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive"><style>
:root{--paper:#faf8f5;--ink:#171512;--line:#ddd6cc;--gold:#a9824c;--stone:#7a7267;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:30px 20px 60px}h1,h2{font-family:Georgia,serif;font-weight:400}.card{background:var(--card);border:1px solid var(--line);padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.login{max-width:420px;margin:8vh auto}.field{display:grid;gap:6px;margin:12px 0}input,select,button{font:inherit;padding:10px;border:1px solid var(--line);background:#fff}button{cursor:pointer;background:var(--ink);color:#fff}.muted{color:var(--stone);font-size:13px}.error{color:#a4402e}.ok{color:#5d7d56}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border:1px solid var(--line);font-size:11px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<section id="loginView" class="card login"><h1>biz ve siz</h1><p class="muted">Yönetim paneli</p><div class="field"><label>E-posta</label><input id="adminEmail" type="email"></div><div class="field"><label>Şifre</label><input id="adminPassword" type="password"></div><button onclick="login()">Giriş Yap</button><p id="loginMsg" class="error"></p></section>
<section id="panel" class="hidden"><div class="top"><div><h1>Yönetim Paneli</h1><p class="muted">Siparişler, talepler ve stok</p></div><button onclick="logout()">Çıkış</button></div>
<div class="grid"><div class="card"><h2>Siparişler</h2><div class="actions"><button onclick="loadOrders()">Tümü</button><button onclick="loadOrders('PAID')">PAID</button><button onclick="loadOrders('REVIEW')">REVIEW</button><button onclick="loadOrders('FAILED')">FAILED</button></div><div id="orders" class="tablewrap"></div></div><div class="card"><h2>Stok</h2><div id="inventory" class="tablewrap"></div></div></div>
<div class="card"><h2>İletişim / Özel Sipariş Talepleri</h2><div id="inquiries" class="tablewrap"></div></div></section></main><script>
let csrf='';async function api(url,opt={},skip401Handling=false){if(!csrf){const r=await fetch('/api/auth/csrf',{credentials:'include'});const d=await r.json();csrf=d.token}opt.credentials='include';opt.headers={...(opt.headers||{}),'X-CSRF-Token':csrf};const r=await fetch(url,opt);if(r.status===401&&!skip401Handling){showLogin();throw new Error('Oturum gerekli')}return r}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('panel').classList.add('hidden')}
async function login(){const msg=document.getElementById('loginMsg');msg.textContent='';try{const r=await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:adminEmail.value,password:adminPassword.value})},true);const d=await r.json();if(!r.ok)throw Error(d.error||'Giriş başarısız.');showPanel()}catch(e){msg.textContent=e.message}}
function showPanel(){document.getElementById('loginView').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll()}
async function loadAll(){loadOrders();loadInventory();loadInquiries()}
async function loadOrders(status=''){const r=await api('/api/admin/orders'+(status?'?status='+encodeURIComponent(status):''));const d=await r.json();document.getElementById('orders').innerHTML=d.orders.length?`<table><tr><th>#</th><th>Durum</th><th>Müşteri</th><th>Tutar</th><th>Tarih</th></tr>${d.orders.map(o=>`<tr><td>${o.id}</td><td><span class="badge">${o.status}</span></td><td>${esc(o.customer_name)}<br>${esc(o.customer_email)}</td><td>₺${Number(o.amount).toLocaleString('tr-TR')}</td><td>${new Date(o.created_at).toLocaleString('tr-TR')}</td></tr>`).join('')}</table>`:'<p class="muted">Sipariş yok.</p>'}
async function loadInventory(){const r=await api('/api/admin/inventory');const d=await r.json();document.getElementById('inventory').innerHTML=`<table><tr><th>Ürün</th><th>Stok</th></tr>${d.inventory.map(x=>`<tr><td>${esc(x.product_key)}</td><td>${x.stock}</td></tr>`).join('')}</table>`}
async function loadInquiries(){const r=await api('/api/admin/inquiries');const d=await r.json();document.getElementById('inquiries').innerHTML=d.inquiries.length?`<table><tr><th>Tarih</th><th>Tip</th><th>Kişi</th><th>Mesaj</th></tr>${d.inquiries.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('tr-TR')}</td><td>${esc(x.type)}</td><td>${esc(x.name)}<br>${esc(x.email)}</td><td>${esc(x.message)}</td></tr>`).join('')}</table>`:'<p class="muted">Talep yok.</p>'}
async function logout(){await api('/api/admin/logout',{method:'POST'});showLogin()}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
